[workspace]
resolver = "2"
members = [
    "tests"
]

exclude = [

]

[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["The RSC-V Kernel Project"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/alessioMaroni/RSC-V"

[workspace.dependencies]

[package]
name = "RSC-V-kernel"
version = "0.12.6"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
description = "A safety-critical kernel built on a Rust foundation, leveraging Ada/SPARK for high integrity."
readme = "README.md"

[dependencies]
tests = { path = "tests", optional = true }
rp2350-hazard3-hall = { path = "../rp2350-hazard3-hall" }

[features]
default = []
debug = []
tests = ["dep:tests"]

[profile.dev]
opt-level = 0
debug = 2
overflow-checks = true 
debug-assertions = true
lto = false
panic = "abort"

[profile.release]
# TODO: Remove
debug = true
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true
# debug = false
strip = "symbols"
